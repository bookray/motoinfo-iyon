<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>TeleGuard Admin Panel</title>
    <link rel="stylesheet" href="/index.css">
    <style>
      /* Mobile safe area and layout normalization */
      html, body {
        height: 100%;
        height: 100dvh;
        width: 100%;
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      /* Custom scrollbar for dark mode feeling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-200 antialiased overflow-x-hidden md:overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
